
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Paper texture filter -->
    <filter id="paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    
    <clipPath id="clip-top-right">
      <circle cx="200" cy="130" r="70" />
    </clipPath>
    <clipPath id="clip-bottom-right">
      <circle cx="270" cy="200" r="70" />
    </clipPath>
  </defs>

  <g id="emblem-group" transform="translate(0, 0)">
    <!-- Left: Movement (Sage Olive #A4A07B) -->
    <circle cx="130" cy="200" r="70" fill="#A4A07B" opacity="0.95" />
    <!-- Bottom: Stillness (Terracotta Clay #DF975F) -->
    <circle cx="200" cy="270" r="70" fill="#DF975F" opacity="0.95" />
    <!-- Right: Breath (Slate Sky #9CB1B6) -->
    <circle cx="270" cy="200" r="70" fill="#9CB1B6" opacity="0.95" />
    <!-- Top: Awareness (Warm Ochre #DFBE91) -->
    <circle cx="200" cy="130" r="70" fill="#DFBE91" opacity="0.95" />
  </g>
</svg>
